name: Bug report
description: A diff produced the wrong card.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A diff goes in and a card of what can break comes out. Paste a small fake diff, not a private change.
  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen?
      options:
        - CLI
        - Web
        - A risk rule
        - The finding card
        - Not sure
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: diff
    attributes:
      label: Fake diff
      description: The smallest diff that shows the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the card should have said
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: This diff is fake and does not come from a private repository.
          required: true
